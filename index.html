<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 휴대폰에서 화면이 작게 축소되지 않도록 화면 폭에 맞춤 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회식 정산기</title>
</head>
<body>
  <h1>🍻 회식 정산기</h1>

  <!-- ① 참석자 입력 -->
  <section id="people-section">
    <h2>① 참석자</h2>
    <input id="name-input" type="text" placeholder="이름 입력">
    <button id="add-person-btn" type="button">추가</button>
    <!-- 추가된 이름이 여기에 표시됨 (script.js가 채움) -->
    <ul id="people-list"></ul>
  </section>

  <!-- ② 차수 입력 -->
  <section id="rounds-section">
    <h2>② 차수</h2>

    <!-- 차수 카드(1차, 2차, 3차)가 여기에 표시됨 (script.js가 채움) -->
    <div id="rounds-list"></div>

    <button id="add-round-btn" type="button">+ 차수 추가</button>
  </section>

  <!-- ③ 정산 결과 -->
  <section id="result-section">
    <h2>③ 정산 결과</h2>
    <!-- 사람별 금액이 여기에 표시됨 (script.js가 채움) -->
    <ul id="result-list"></ul>
    <!-- 총액, 그리고 100원 올림으로 더 걷힌 금액 안내 -->
    <p id="total-message"></p>
    <p id="extra-message"></p>
    <!-- 계산할 수 없는 차수가 있을 때 안내 -->
    <ul id="warning-list"></ul>
    <button id="copy-btn" type="button">📋 단톡방용 복사</button>
  </section>

  <!-- 동작을 담당하는 JavaScript 파일 연결 (화면을 다 그린 뒤 실행되도록 맨 아래에 둠) -->
  <script src="script.js"></script>
</body>
</html>
