<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 휴대폰에서 화면이 작게 축소되지 않도록 화면 폭에 맞춤 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회식 정산기</title>
  <!-- 디자인 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- 맨 위 주황 배너 -->
    <header class="app-header">
      <div class="app-icon">🍻</div>
      <div>
        <h1>회식 정산기</h1>
        <p>1차, 2차, 3차 참석자가 달라도 한 번에 정산해요</p>
      </div>
    </header>

    <!-- ① 참석자 입력 -->
    <section class="card" id="people-section">
      <h2>① 참석자</h2>
      <div class="input-row">
        <input id="name-input" type="text" placeholder="이름 입력 후 추가">
        <button id="add-person-btn" class="btn" type="button">추가</button>
      </div>
      <!-- 추가된 이름이 여기에 표시됨 (script.js가 채움) -->
      <ul id="people-list" class="chips"></ul>
    </section>

    <!-- ② 차수 입력 -->
    <section id="rounds-section">
      <h2 class="section-title">② 차수</h2>

      <!-- 차수 카드(1차, 2차, 3차)가 여기에 표시됨 (script.js가 채움) -->
      <div id="rounds-list"></div>

      <button id="add-round-btn" class="btn-dashed" type="button">+ 차수 추가 (최대 3차)</button>
    </section>

    <!-- ③ 정산 결과 -->
    <!-- 영수증 모양 -->
    <section class="card result-card" id="result-section">
      <div class="receipt-header">
        <h2>③ 정산 결과</h2>
        <span id="receipt-date"></span>
      </div>
      <!-- 사람별 금액이 여기에 표시됨 (script.js가 채움) -->
      <ul id="result-list"></ul>
      <!-- 총액, 그리고 100원 올림으로 더 걷힌 금액 안내 -->
      <p id="total-message"></p>
      <p id="extra-message"></p>
      <!-- 계산할 수 없는 차수가 있을 때 안내 -->
      <ul id="warning-list"></ul>
      <button id="copy-btn" class="btn btn-primary" type="button">📋 단톡방용 복사</button>
    </section>
  </main>

  <!-- 복사했을 때 화면 아래에 잠깐 뜨는 알림 -->
  <div id="toast" role="status"></div>

  <!-- 동작을 담당하는 JavaScript 파일 연결 (화면을 다 그린 뒤 실행되도록 맨 아래에 둠) -->
  <script src="script.js"></script>
</body>
</html>
